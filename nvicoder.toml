# nvicoder.toml — project level
effort = "high"
model = "nvidia/nemotron-3-ultra-550b-a55b"
yolo = false

# Dual-model mode (Constitutional AI Critic architecture):
# - CRITIC_MODEL: "critic" - Constitutional AI self-critique, evaluates output for Harmless/Honest/Helpful
# - ASSISTANT_MODEL: "doer" - fast execution, tool-calling, produces output for critique
dual_model = false
critic_model = "nvidia/nemotron-3-ultra-550b-a55b"
assistant_model = "meta/muse-glimmer-30b"

# Multi-API Key Rotation (failover on rate limit / 503 / timeout)
[api]
request_timeout = 180
max_retries = 5
retry_backoff_factor = 2.0
retry_status_codes = [429, 500, 502, 503, 504]

# Fallback endpoints (auto-rotate on failure)
# Uses NVIDIA_API_KEY_2, NVIDIA_API_KEY_3 from .env
fallback_endpoints = [
    { name = "fallback-1", env_key = "NVIDIA_API_KEY_2", base_url = "https://integrate.api.nvidia.com/v1" },
    { name = "fallback-2", env_key = "NVIDIA_API_KEY_3", base_url = "https://integrate.api.nvidia.com/v1" },
]

# Rotation settings
rotation_strategy = "round_robin"      # round_robin | least_used | random
max_failures_before_switch = 2         # switch after N consecutive failures
cooldown_seconds = 60                  # cooldown before retrying a failed endpoint
