[project]
name = "nvicoder"
version = "0.1.0"
description = "Coding agent CLI ala Claude Code, berbasis NVIDIA NIM API"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "tomli>=2.0; python_version < '3.11'",
    "playwright>=1.40.0",
    "mcp>=1.0.0",
]

[project.scripts]
nvicoder = "nvicoder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nvicoder"]

[tool.setuptools.package-data]
nvicoder = ["prompt.md"]
